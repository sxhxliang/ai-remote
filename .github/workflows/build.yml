name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_VERSION: 1.96.0

jobs:
  frontend:
    name: Frontend and release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: version
        run: node scripts/release-version.mjs
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: node --test scripts/release.test.mjs
      - run: sh -n install.sh
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            rustflags: ''
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/target
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      BUILD_VERSION: ${{ needs.frontend.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --target "$TARGET"
          rustup override set "$RUST_VERSION"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          key: rust-${{ runner.os }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend
          path: frontend/dist
      - name: Format, lint, test and build Rust services
        run: |
          for crate in home-agent signaling-server turn-server; do
            cargo fmt --manifest-path "$crate/Cargo.toml" -- --check
            cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets --target "$TARGET" -- -D warnings
            cargo test --locked --manifest-path "$crate/Cargo.toml" --all-targets --target "$TARGET"
            cargo build --locked --manifest-path "$crate/Cargo.toml" --release --bins --target "$TARGET"
          done
      - name: End-to-end Mock Ollama, WebRTC and TURN tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          LOCAL_BINARY_DIR: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug
        run: |
          npm --prefix frontend ci
          for crate in home-agent signaling-server turn-server; do
            cargo build --locked --manifest-path "$crate/Cargo.toml" --all-targets --target "$TARGET"
          done
          node scripts/local-test.mjs --no-build
      - name: Package binaries, frontend and configuration templates
        run: node scripts/package-release.mjs --target "$TARGET" --version "$BUILD_VERSION" --bin-dir "$CARGO_TARGET_DIR/$TARGET/release"
      - name: Verify installation, upgrades and checksum rejection
        run: node scripts/test-installers.mjs --target "$TARGET" --version "$BUILD_VERSION"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: |
            .artifacts/*.tar.gz
            .artifacts/*.zip
            .artifacts/*.sha256
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: package-*
          path: .artifacts
          merge-multiple: true
      - run: node scripts/package-release.mjs --verify .artifacts
      - name: Prepare checksums and release notes
        run: node scripts/prepare-release.mjs
      - name: Upload all assets before publishing
        shell: bash
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$existing" = true || { echo 'This release is already published. Create a new version instead of replacing it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "AI Remote $RELEASE_TAG" --notes-file .artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" .artifacts/*.tar.gz .artifacts/*.zip .artifacts/*.sha256 .artifacts/SHA256SUMS install.sh install.ps1 --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
